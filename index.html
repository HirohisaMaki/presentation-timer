<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プレゼンテーションタイマー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.5s ease;
    }
    .container {
      text-align: center;
      width: 90%;
      max-width: 600px;
      padding: 2rem;
      background: #1e1e1e;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      color: #aaa;
      margin-bottom: 1.5rem;
      font-weight: 400;
    }
    .timer-display {
      font-size: 6.5rem;
      font-weight: 700;
      font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
      letter-spacing: -2px;
      margin: 1rem 0;
      color: #4caf50;
      transition: color 0.3s ease;
    }
    /* 警告状態：残り1分未満 */
    .timer-display.warning {
      color: #ffeb3b;
    }
    /* 終了状態 */
    .timer-display.ended {
      color: #f44336;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0.5; }
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1rem;
      color: #ccc;
    }
    input[type="number"] {
      width: 70px;
      padding: 8px;
      font-size: 1.1rem;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
    }
    .btn-start { background-color: #4caf50; color: #fff; }
    .btn-pause { background-color: #ff9800; color: #fff; }
    .btn-reset { background-color: #607d8b; color: #fff; }
    .preset-btn { background-color: #333; color: #ddd; border: 1px solid #555; padding: 6px 12px; font-size: 0.85rem; }
    
    .presets {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .shortcut-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>プレゼンテーションタイマー</h1>

  <div class="input-group">
    <label for="minutes">持ち時間:</label>
    <input type="number" id="minutes" value="5" min="0" max="180">
    <span>分</span>
  </div>

  <div class="presets">
    <button class="preset-btn" onclick="setMinutes(3)">3分</button>
    <button class="preset-btn" onclick="setMinutes(5)">5分</button>
    <button class="preset-btn" onclick="setMinutes(10)">10分</button>
    <button class="preset-btn" onclick="setMinutes(15)">15分</button>
  </div>

  <div class="timer-display" id="display">05:00</div>

  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="btn-reset" onclick="resetTimer()">リセット</button>
  </div>

  <div class="shortcut-hint">
    [Space] 一時停止 / 再開 &nbsp;|&nbsp; [R] リセット
  </div>
</div>

<script>
  let timerInterval = null;
  let totalSeconds = 300;
  let remainingSeconds = 300;
  let isRunning = false;
  let isCountUp = false;

  const display = document.getElementById('display');
  const minutesInput = document.getElementById('minutes');
  const startBtn = document.getElementById('startBtn');

  function updateDisplay() {
    const mins = Math.floor(Math.abs(remainingSeconds) / 60);
    const secs = Math.abs(remainingSeconds) % 60;
    const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    
    display.textContent = (remainingSeconds < 0 ? '-' : '') + formatted;

    // スタイル変更
    display.classList.remove('warning', 'ended');
    if (!isCountUp) {
      if (remainingSeconds <= 0) {
        display.classList.add('ended');
      } else if (remainingSeconds <= 60) {
        display.classList.add('warning');
      }
    }
  }

  function setMinutes(val) {
    minutesInput.value = val;
    resetTimer();
  }

  function toggleTimer() {
    if (isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function startTimer() {
    if (isRunning) return;

    if (timerInterval === null && remainingSeconds === totalSeconds) {
      const mins = parseInt(minutesInput.value, 10) || 0;
      totalSeconds = mins * 60;
      remainingSeconds = totalSeconds;
      isCountUp = (totalSeconds === 0);
    }

    isRunning = true;
    startBtn.textContent = '一時停止';
    startBtn.className = 'btn-pause';

    timerInterval = setInterval(() => {
      if (isCountUp) {
        remainingSeconds++;
      } else {
        remainingSeconds--;
      }
      updateDisplay();
    }, 1000);
  }

  function pauseTimer() {
    if (!isRunning) return;
    isRunning = false;
    clearInterval(timerInterval);
    startBtn.textContent = '再開';
    startBtn.className = 'btn-start';
  }

  function resetTimer() {
    pauseTimer();
    timerInterval = null;
    const mins = parseInt(minutesInput.value, 10) || 0;
    totalSeconds = mins * 60;
    remainingSeconds = totalSeconds;
    isCountUp = (totalSeconds === 0);
    startBtn.textContent = 'スタート';
    startBtn.className = 'btn-start';
    updateDisplay();
  }

  minutesInput.addEventListener('change', resetTimer);

  // キーボードショートカット
  document.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT') return;
    if (e.code === 'Space') {
      e.preventDefault();
      toggleTimer();
    } else if (e.code === 'KeyR') {
      resetTimer();
    }
  });

  updateDisplay();
</script>

</body>
</html>
